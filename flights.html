<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Авиабилеты</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">

<style>

/* шапка */
.header{
  color:white;
  padding:40px;
  text-align:center;
}

/* карточки */
.flight-card{
  padding:20px;
}

.flight-card:hover{
  transform:translateY(-5px);
}

/* цена */
.price{
  font-size:20px;
  font-weight:bold;
  color:var(--primary);
}

/* autocomplete */
.ac-wrap{
  position: relative;
}
.ac-dropdown{
  position:absolute;
  top: calc(100% + 6px);
  left:0;
  right:0;
  z-index: 1000;
  background: #fff;
  border-radius: 12px;
  border: 1px solid rgba(0,0,0,0.12);
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  overflow: hidden;
  max-height: 320px;
  display:none;
}
.ac-item{
  padding: 10px 12px;
  cursor: pointer;
  display:flex;
  justify-content:space-between;
  gap: 12px;
}
.ac-item:hover{
  background: #f3f6ff;
}
.ac-item .meta{
  font-size: 12px;
  color: #6c757d;
}
.ac-empty{
  padding: 10px 12px;
  color:#6c757d;
}

</style>

</head>

<body>

<div id="app-navbar"></div>

<div class="header">
  <h1><i class="fa-solid fa-plane"></i> Поиск авиабилетов</h1>
  <p>Лучшие цены на рейсы</p>
</div>

<div class="container mt-5">

  <div class="card shadow-sm mb-4 search-panel">
    <div class="card-body p-3 p-md-4">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-md-5">
          <label class="form-label mb-1">Откуда</label>
          <div class="ac-wrap">
            <input id="fromInput" class="form-control" placeholder="Начни вводить город или аэропорт" autocomplete="off">
            <div id="fromDropdown" class="ac-dropdown"></div>
          </div>
        </div>
        <div class="col-12 col-md-5">
          <label class="form-label mb-1">Куда</label>
          <div class="ac-wrap">
            <input id="toInput" class="form-control" placeholder="Начни вводить город или аэропорт" autocomplete="off">
            <div id="toDropdown" class="ac-dropdown"></div>
          </div>
        </div>
        <div class="col-12 col-md-2 d-grid">
          <button id="clearBtn" class="btn btn-outline-secondary">Сбросить</button>
        </div>
      </div>
      <div class="small text-muted mt-2">Подсказки строятся по данным существующих рейсов.</div>
    </div>
  </div>

  <div id="flights" class="row"></div>

</div>

<script src="common.js"></script>
<script>
renderNavbar({ active: 'flights.html' });
if(!requireAuth()){
  throw new Error('unauthorized');
}

const flightsRoot = document.getElementById('flights');
const fromInput = document.getElementById('fromInput');
const toInput = document.getElementById('toInput');
const clearBtn = document.getElementById('clearBtn');
const fromDropdown = document.getElementById('fromDropdown');
const toDropdown = document.getElementById('toDropdown');

let allFlights = [];
let fromSelected = null;
let toSelected = null;

function norm(s){
  return String(s || '').toLowerCase().trim();
}

function uniqOptions(options){
  const map = new Map();
  options.forEach((o) => {
    const key = `${norm(o.city)}|${norm(o.airport)}|${norm(o.country)}`;
    if (!map.has(key)) map.set(key, o);
  });
  return Array.from(map.values());
}

function buildOptions(flights){
  const all = [];
  flights.forEach((f) => {
    all.push({ city: f.departure_city, airport: f.departure_airport, country: f.departure_country });
    all.push({ city: f.arrival_city, airport: f.arrival_airport, country: f.arrival_country });
  });
  const unified = uniqOptions(all);
  return { from: unified, to: unified };
}

function renderFlights(list){
  flightsRoot.innerHTML = '';
  if (!Array.isArray(list) || list.length === 0) {
    flightsRoot.innerHTML = '<p class="text-muted">Рейсы не найдены по заданным условиям</p>';
    return;
  }
  list.forEach((f) => {
    flightsRoot.innerHTML += `
    <div class="col-md-6">
      <div class="flight-card mb-4">
        <div class="d-flex justify-content-between">
          <div>
            <h5><i class="fa-solid fa-plane"></i> ${f.flight_number} (${f.airline_name})</h5>
            <p>${f.departure_city} → ${f.arrival_city}</p>
            <small>Вылет: ${new Date(f.scheduled_departure).toLocaleString('ru-RU')}</small><br/>
            <small>Прилет: ${new Date(f.scheduled_arrival).toLocaleString('ru-RU')}</small>
          </div>
          <div class="text-end">
            <div class="price">${Math.round(Number(f.base_price))} ₽</div>
            <div class="mb-2"><small>Статус: ${f.status}</small></div>
            <button class="btn btn-primary mt-2" onclick="loadSeats(${f.flight_id})">
              <i class="fa-solid fa-chair"></i> Выбрать место
            </button>
          </div>
        </div>
      </div>
    </div>
    `;
  });
}

function applyFilters(){
  const fromNeedle = fromSelected ? norm(fromSelected.city) : norm(fromInput.value);
  const toNeedle = toSelected ? norm(toSelected.city) : norm(toInput.value);

  const filtered = allFlights.filter((f) => {
    const dep = norm(f.departure_city);
    const arr = norm(f.arrival_city);
    const depAirport = norm(f.departure_airport);
    const arrAirport = norm(f.arrival_airport);

    const fromOk = !fromNeedle || dep.includes(fromNeedle) || depAirport.includes(fromNeedle);
    const toOk = !toNeedle || arr.includes(toNeedle) || arrAirport.includes(toNeedle);
    return fromOk && toOk;
  });
  renderFlights(filtered);
}

function hideDropdown(el){
  el.style.display = 'none';
  el.innerHTML = '';
}

function showDropdown(el){
  el.style.display = 'block';
}

function renderDropdown(el, items, onPick){
  if (!items.length){
    el.innerHTML = `<div class="ac-empty">Ничего не найдено</div>`;
    showDropdown(el);
    return;
  }
  el.innerHTML = items.slice(0, 8).map((o) => `
    <div class="ac-item"
      data-city="${String(o.city).replace(/"/g, '&quot;')}"
      data-airport="${String(o.airport).replace(/"/g, '&quot;')}"
      data-country="${String(o.country || '').replace(/"/g, '&quot;')}">
      <div>
        <div><strong>${o.city}</strong></div>
        <div class="meta">${o.country || ''}</div>
      </div>
      <div class="meta">${(o.city || '').slice(0,3).toUpperCase()}</div>
    </div>
  `).join('');
  showDropdown(el);

  Array.from(el.querySelectorAll('.ac-item')).forEach((node) => {
    node.onclick = () => {
      const picked = {
        city: node.getAttribute('data-city'),
        airport: node.getAttribute('data-airport'),
        country: node.getAttribute('data-country')
      };
      onPick(picked);
      hideDropdown(el);
    };
  });
}

function attachAutocomplete(inputEl, dropdownEl, allOptions, onSelected){
  function getMatches(q){
    const n = norm(q);
    if (!n) return allOptions;
    return allOptions.filter((o) => norm(o.city).includes(n) || norm(o.airport).includes(n) || norm(o.country).includes(n));
  }

  inputEl.addEventListener('input', () => {
    onSelected(null);
    renderDropdown(dropdownEl, getMatches(inputEl.value), (picked) => {
      inputEl.value = picked.city;
      onSelected(picked);
      applyFilters();
    });
    applyFilters();
  });

  inputEl.addEventListener('focus', () => {
    renderDropdown(dropdownEl, getMatches(inputEl.value), (picked) => {
      inputEl.value = picked.city;
      onSelected(picked);
      applyFilters();
    });
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hideDropdown(dropdownEl);
  });

  document.addEventListener('click', (e) => {
    if (!dropdownEl.contains(e.target) && e.target !== inputEl) hideDropdown(dropdownEl);
  });
}

clearBtn.onclick = () => {
  fromInput.value = '';
  toInput.value = '';
  fromSelected = null;
  toSelected = null;
  hideDropdown(fromDropdown);
  hideDropdown(toDropdown);
  renderFlights(allFlights);
};

apiGet('/flights')
  .then((data) => {
    allFlights = Array.isArray(data) ? data : [];
    const opts = buildOptions(allFlights);
    attachAutocomplete(fromInput, fromDropdown, opts.from, (v) => { fromSelected = v; });
    attachAutocomplete(toInput, toDropdown, opts.to, (v) => { toSelected = v; });
    renderFlights(allFlights);
  })
  .catch(() => {
    flightsRoot.innerHTML = '<p>Не удалось загрузить рейсы</p>';
  });

function loadSeats(id){
  window.location = "booking.html?flight=" + id;
}

</script>

</body>
</html>

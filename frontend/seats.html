<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Выбор мест</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="app.css" rel="stylesheet">
  <style>
    .flight-card{ padding:20px; }
  </style>
</head>
<body>
  <div id="app-navbar"></div>

  <div class="container mt-5">
    <div class="flight-card">
      <div>
        <h3 class="mb-3"><i class="fa-solid fa-chair"></i> Выбор мест</h3>
        <p class="text-muted mb-3">Сначала выбери рейс, затем перейдешь к схеме мест.</p>

        <div class="mb-3">
          <label class="form-label">Рейс</label>
          <div class="ac-wrap">
            <input id="flightInput" class="form-control" placeholder="Начни вводить номер рейса или город" autocomplete="off">
            <div id="flightDropdown" class="ac-dropdown"></div>
          </div>
          <div id="flightHint" class="small text-muted mt-2">Выберите рейс из списка подсказок.</div>
        </div>

        <button id="goBtn" class="buy-btn"><i class="fa-solid fa-plane"></i> Перейти к местам</button>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    renderNavbar({ active: 'seats.html' });
    if (!requireAuth()) throw new Error('unauthorized');

    const flightInput = document.getElementById('flightInput');
    const flightDropdown = document.getElementById('flightDropdown');
    const flightHint = document.getElementById('flightHint');
    const goBtn = document.getElementById('goBtn');
    let allFlights = [];
    let selectedFlightId = null;

    function norm(s){
      return String(s || '').toLowerCase().trim();
    }

    function hideDropdown(){
      flightDropdown.style.display = 'none';
      flightDropdown.innerHTML = '';
    }

    function showDropdown(){
      flightDropdown.style.display = 'block';
    }

    function getMatches(q){
      const n = norm(q);
      if(!n) return allFlights;
      return allFlights.filter((f) => {
        return (
          norm(f.flight_number).includes(n) ||
          norm(f.airline_name).includes(n) ||
          norm(f.departure_city).includes(n) ||
          norm(f.arrival_city).includes(n) ||
          norm(f.departure_airport).includes(n) ||
          norm(f.arrival_airport).includes(n)
        );
      });
    }

    function renderDropdown(list){
      if(!Array.isArray(list) || list.length === 0){
        flightDropdown.innerHTML = `<div class="ac-empty">Ничего не найдено</div>`;
        showDropdown();
        return;
      }
      flightDropdown.innerHTML = list.slice(0, 10).map((f) => `
        <div class="ac-item"
          data-id="${f.flight_id}"
          data-label="${String(f.flight_number).replace(/"/g, '&quot;')}">
          <div>
            <div><strong>${f.flight_number}</strong> — ${f.departure_city} → ${f.arrival_city}</div>
            <div class="meta">${f.airline_name} • ${new Date(f.scheduled_departure).toLocaleString('ru-RU')}</div>
          </div>
          <div class="meta">${Math.round(Number(f.base_price || 0)).toLocaleString('ru-RU')} ₽</div>
        </div>
      `).join('');
      showDropdown();

      Array.from(flightDropdown.querySelectorAll('.ac-item')).forEach((node) => {
        node.onclick = () => {
          selectedFlightId = node.getAttribute('data-id');
          const label = node.getAttribute('data-label') || '';
          flightInput.value = label;
          flightHint.textContent = `Выбран рейс: ${label}`;
          hideDropdown();
        };
      });
    }

    flightInput.addEventListener('input', () => {
      selectedFlightId = null;
      flightHint.textContent = 'Выберите рейс из списка подсказок.';
      renderDropdown(getMatches(flightInput.value));
    });

    flightInput.addEventListener('focus', () => {
      renderDropdown(getMatches(flightInput.value));
    });

    flightInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hideDropdown();
    });

    document.addEventListener('click', (e) => {
      if (!flightDropdown.contains(e.target) && e.target !== flightInput) hideDropdown();
    });

    apiGet('/flights')
      .then((flights) => {
        allFlights = Array.isArray(flights) ? flights : [];
        if (!allFlights.length) {
          flightInput.disabled = true;
          flightInput.value = 'Нет доступных рейсов';
          goBtn.disabled = true;
          return;
        }
      })
      .catch(() => {
        flightInput.disabled = true;
        flightInput.value = 'Ошибка загрузки рейсов';
        goBtn.disabled = true;
      });

    goBtn.onclick = () => {
      const flightId = selectedFlightId;
      if (!flightId) return;
      window.location = `booking.html?flight=${flightId}`;
    };
  </script>
</body>
</html>

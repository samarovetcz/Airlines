<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="app.css" rel="stylesheet">
  <style>
    .flight-card{ }
  </style>
</head>
<body>
  <div id="app-navbar"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="flight-card">
          <div class="card-body p-4">
            <h3 class="mb-3"><i class="fa-solid fa-right-to-bracket"></i> Вход</h3>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input id="email" class="form-control" placeholder="mail@example.com" autocomplete="email" />
            </div>

            <div class="mb-3">
              <label class="form-label">Пароль</label>
              <input id="pass" class="form-control" type="password" placeholder="Пароль" autocomplete="current-password" />
            </div>

            <div id="msg" class="small text-danger mb-3" style="display:none"></div>

            <button class="btn btn-primary w-100" onclick="login()">Войти</button>

            <div class="text-center mt-3">
              Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    renderNavbar({ active: 'login.html', mode: 'guest' });

    if(localStorage.getItem('token')){
      window.location = 'index.html';
    }

    function showMsg(text) {
      const el = document.getElementById('msg');
      el.style.display = 'block';
      el.textContent = text;
    }

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('pass').value;

      if (!email || !password) return showMsg('Заполни email и пароль');

      try {
        const payload = await apiPost('/login', { email, password });
        localStorage.setItem('token', payload.token);
        localStorage.setItem('user', JSON.stringify(payload.user || {}));
        window.location = 'index.html';
      } catch (e) {
        showMsg(e.message || 'Неверный логин или пароль');
      }
    }
  </script>
</body>
</html>

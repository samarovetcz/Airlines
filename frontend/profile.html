<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Личный кабинет</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">

<style>
</style>

</head>

<body>

<div id="app-navbar"></div>

<div class="container mt-5">

<h2 class="mb-4"><i class="fa-solid fa-ticket"></i> Мои билеты</h2>

<div id="tickets"></div>

</div>

<script src="common.js"></script>
<script>
renderNavbar({ active: 'profile.html' });
if(!requireAuth()){
  throw new Error('unauthorized');
}

apiGet('/my-tickets')
.then(data => {

  const div = document.getElementById('tickets');

  if(data.length === 0){
    div.innerHTML = "<p>У вас пока нет билетов</p>";
    return;
  }

  data.forEach(t => {

    div.innerHTML += `
    <div class="flight-card mb-3">

      <h5><i class="fa-solid fa-plane"></i> ${t.flight_number} | Билет: ${t.ticket_number}</h5>
      <p>${t.departure_city} → ${t.arrival_city}</p>
      <p>Вылет: ${new Date(t.scheduled_departure).toLocaleString('ru-RU')}</p>
      <p><i class="fa-solid fa-chair"></i> Место: ${t.seat_number} (${t.fare_class})</p>
      <p>Бронь: ${t.booking_reference} | Статус: ${t.booking_status}</p>
      <p>Оплата: ${t.payment_status || 'нет'} (${t.payment_method || '-'})</p>

    </div>
    `;

  });

})
.catch((e) => {
  if(e.status === 401){
    logout();
    return;
  }
  document.getElementById('tickets').innerHTML = "<p>Не удалось загрузить билеты</p>";
});

</script>

</body>
</html>

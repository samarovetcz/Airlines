<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выбор мест</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="app.css" rel="stylesheet">

<style>
.page-wrap{ padding:24px 0 40px; }
.back-link{ display:inline-block; margin-bottom:12px; color:var(--primary); text-decoration:none; font-weight:600; }
.back-link:hover{ text-decoration:underline; }
.flight-info{
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
}
.flight-times{ font-weight:700; font-size:24px; line-height:1; }
.flight-city{ color:var(--muted); font-size:13px; }
.layout{ display:grid; grid-template-columns:1fr 320px; gap:20px; }
@media (max-width: 992px){ .layout{ grid-template-columns:1fr; } }
.panel{ border-radius:16px; }
.seat-panel{ padding:18px; }
.legend span{ display:inline-block; margin-right:15px; font-size:14px; }
.legend{ display:flex; flex-wrap:wrap; gap:12px 18px; margin-bottom:16px; font-size:14px; }
.legend-item{ display:flex; align-items:center; gap:8px; }
.dot{
  width:12px;
  height:12px;
  display:inline-block;
  border-radius:50%;
  margin-right:5px;
}
.dot-free{ background:rgba(0,198,255,0.9); } .dot-busy{ background:rgba(255,255,255,0.25); } .dot-picked{ background:rgba(124,58,237,0.85); }

.plane{
  border-radius:30px;
  padding:30px;
  max-width:400px;
  margin:auto;
  border:1px solid rgba(0,198,255,0.18);
  box-shadow: 0 0 24px rgba(0,0,0,0.45), 0 0 18px rgba(0,198,255,0.10);
}
.nose{
  width:100%;
  height:30px;
  background:rgba(255,255,255,0.10);
  border-radius:50% 50% 0 0;
  margin-bottom:10px;
}
.seat-grid{ display:grid; grid-template-columns:40px 40px 20px 40px 40px; gap:10px; justify-content:center; }
.aisle{ width:20px; }
.seat{
  width:40px;
  height:40px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  cursor:pointer;
  transition:0.2s;
  border:none;
  font-weight:700;
}
.seat:hover{ transform:scale(1.1); }
.occupied{ cursor:not-allowed; }
.side-card{ padding:18px; }
.side-title{ font-size:20px; font-weight:700; margin-bottom:14px; }
.selected-seat-num{ font-size:38px; font-weight:800; color:var(--text); line-height:1; }
.muted{ color:var(--muted); }
.price{ font-size:28px; font-weight:800; }
.info-list{ display:flex; flex-direction:column; gap:10px; font-size:14px; }
.msg{ margin-top:10px; font-size:14px; }
</style>

</head>
<body>
<div id="app-navbar"></div>

<div class="container page-wrap">
  <a href="flights.html" class="back-link">← Назад к рейсам</a>
  <h2 class="mb-3"><i class="fa-solid fa-chair"></i> Выбор места</h2>

  <div id="flightStrip" class="flight-info">Загрузка данных рейса...</div>

  <div class="layout">
    <div class="panel seat-panel">
      <div class="legend">
        <div class="legend-item"><span class="dot dot-free"></span>Свободно</div>
        <div class="legend-item"><span class="dot dot-busy"></span>Занято</div>
        <div class="legend-item"><span class="dot dot-picked"></span>Выбрано</div>
      </div>
      <div class="plane">
        <div class="nose"></div>
        <div id="seats" class="seat-grid"></div>
      </div>
      <div id="msg" class="msg muted"></div>
    </div>

    <div class="d-flex flex-column gap-3">
      <div class="panel side-card">
        <div class="side-title">Выбранное место</div>
        <div id="selectedSeatNum" class="selected-seat-num">—</div>
        <div id="selectedSeatClass" class="muted mb-2">Выберите место на схеме</div>
        <div id="selectedPrice" class="price mb-3">—</div>
        <button id="buyBtn" class="buy-btn w-100"><i class="fa-solid fa-credit-card"></i> Продолжить</button>
      </div>

      <div class="panel side-card">
        <div class="side-title">Информация о рейсе</div>
        <div id="flightInfo" class="info-list muted"><div>Загрузка...</div></div>
      </div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
renderNavbar({ active: 'seats.html' });
if(!requireAuth()) throw new Error('unauthorized');

const url = new URLSearchParams(window.location.search);
const flight = url.get('flight');
if(!flight) window.location = 'flights.html';

let selectedSeat = null;
let selectedSeatMeta = null;
let selectedFlight = null;
let allSeats = [];
const seatsDiv = document.getElementById('seats');
const msgEl = document.getElementById('msg');
const buyBtn = document.getElementById('buyBtn');

function showMsg(text, isError){
  msgEl.textContent = text;
  msgEl.className = `msg ${isError ? 'text-danger' : 'muted'}`;
}

function updateSelectedCard(){
  const seatNum = document.getElementById('selectedSeatNum');
  const seatClass = document.getElementById('selectedSeatClass');
  const seatPrice = document.getElementById('selectedPrice');
  if (!selectedSeatMeta) {
    seatNum.textContent = '—';
    seatClass.textContent = 'Выберите место на схеме';
    seatPrice.textContent = '—';
    return;
  }
  seatNum.textContent = selectedSeatMeta.seat_number;
  seatClass.textContent = selectedSeatMeta.seat_class === 'business' ? 'Бизнес-класс' : 'Эконом-класс';
  const base = selectedFlight ? Math.round(Number(selectedFlight.base_price)) : 0;
  const final = selectedSeatMeta.seat_class === 'business' ? Math.round(base * 1.35) : base;
  seatPrice.textContent = `${final.toLocaleString('ru-RU')} ₽`;
}

function renderFlightStrip(f){
  const strip = document.getElementById('flightStrip');
  strip.innerHTML = `
    <div class="row g-3 align-items-center">
      <div class="col-md-3">
        <div class="fw-bold fs-5">${f.flight_number}</div>
        <div class="muted">${f.airline_name}</div>
      </div>
      <div class="col-md-3">
        <div class="flight-times">${new Date(f.scheduled_departure).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' })}</div>
        <div class="flight-city">${f.departure_city} (${f.departure_airport})</div>
      </div>
      <div class="col-md-3">
        <div class="flight-times">${new Date(f.scheduled_arrival).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' })}</div>
        <div class="flight-city">${f.arrival_city} (${f.arrival_airport})</div>
      </div>
      <div class="col-md-3 text-md-end">
        <div class="muted">Базовая цена</div>
        <div class="fw-bold fs-4">${Math.round(Number(f.base_price)).toLocaleString('ru-RU')} ₽</div>
      </div>
    </div>
  `;
}

function renderFlightInfo(f){
  const el = document.getElementById('flightInfo');
  el.innerHTML = `
    <div><strong>Маршрут:</strong> ${f.departure_city} → ${f.arrival_city}</div>
    <div><strong>Дата вылета:</strong> ${new Date(f.scheduled_departure).toLocaleDateString('ru-RU')}</div>
    <div><strong>Время:</strong> ${new Date(f.scheduled_departure).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' })} - ${new Date(f.scheduled_arrival).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' })}</div>
    <div><strong>Авиакомпания:</strong> ${f.airline_name}</div>
    <div><strong>Класс:</strong> Эконом / Бизнес</div>
  `;
}

function renderSeats(){
  seatsDiv.innerHTML = '';
  if (!allSeats.length) {
    showMsg('Места для рейса не найдены', true);
    return;
  }
  const sorted = [...allSeats].sort((a, b) => {
    const ra = parseInt(a.seat_number, 10);
    const rb = parseInt(b.seat_number, 10);
    if (ra !== rb) return ra - rb;
    return a.seat_number.localeCompare(b.seat_number);
  });

  for (let i = 0; i < sorted.length; i += 4) {
    const rowSeats = sorted.slice(i, i + 4);
    rowSeats.forEach((seat, idx) => {
      if (idx === 2) {
        const aisle = document.createElement('div');
        aisle.className = 'aisle';
        seatsDiv.appendChild(aisle);
      }
      const btn = document.createElement('button');
      btn.textContent = seat.seat_number;
      btn.classList.add('seat', seat.status === 'occupied' ? 'occupied' : 'available');
      if (selectedSeatMeta && selectedSeatMeta.seat_id === seat.seat_id) btn.classList.add('selected');
      if (seat.status === 'occupied') {
        btn.disabled = true;
      } else {
        btn.onclick = () => {
          selectedSeat = seat.seat_id;
          selectedSeatMeta = seat;
          updateSelectedCard();
          renderSeats();
          showMsg(`Выбрано место ${seat.seat_number}`, false);
        };
      }
      seatsDiv.appendChild(btn);
    });
  }
}

Promise.all([apiGet('/flights'), apiGet('/flights/' + flight + '/seats')])
  .then(([flights, seats]) => {
    selectedFlight = (flights || []).find((f) => Number(f.flight_id) === Number(flight));
    allSeats = Array.isArray(seats) ? seats : [];
    if (selectedFlight) {
      renderFlightStrip(selectedFlight);
      renderFlightInfo(selectedFlight);
    } else {
      showMsg('Данные рейса не найдены', true);
    }
    renderSeats();
    updateSelectedCard();
  })
  .catch(() => showMsg('Не удалось загрузить данные для выбора места', true));

function buy(){
  if(!selectedSeat){
    showMsg('Сначала выберите место', true);
    return;
  }
  apiPost('/bookings', {
    flight_id: Number(flight),
    seat_id: Number(selectedSeat),
    payment_method: 'card'
  }).then((payload) => {
    alert(`Бронь ${payload.booking.booking_reference} оформлена, билет ${payload.ticket.ticket_number}`);
    window.location = 'profile.html';
  }).catch((e) => {
    if(e.status === 401){
      alert('Сессия истекла, войдите заново');
      logout();
      return;
    }
    showMsg(e.message || 'Ошибка покупки', true);
  });
}

buyBtn.addEventListener('click', buy);
</script>

</body>
</html>
